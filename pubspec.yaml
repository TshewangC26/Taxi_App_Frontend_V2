name: taxi_app_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  geolocator: ^14.0.2
  firebase_core: ^4.6.0
  firebase_database: ^12.2.0
  firebase_messaging: ^16.1.3
  google_maps_flutter: ^2.17.0
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.13.1
  location: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/taxi_logo.png


flutter_launcher_icons:
  image_path: "assets/images/taxi_icon.jpg"
  android: true
  remove_alpha_ios: false